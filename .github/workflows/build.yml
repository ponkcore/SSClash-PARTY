name: Build and test

on:
  push:
    branches:
      - main
      - party
      - "feature/**"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag for a GitHub prerelease"
        required: false
        type: string

permissions:
  contents: read

env:
  PACKAGE_NAME: luci-app-ssclash

jobs:
  quality:
    name: Static and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: luci-app-ssclash/profile-merge/go.mod
          cache-dependency-path: luci-app-ssclash/profile-merge/go.sum

      - name: Check workflow definitions
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "/tmp/${archive}" |
            sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -color

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Check Go formatting and tests
        working-directory: luci-app-ssclash/profile-merge
        run: |
          test -z "$(gofmt -l main.go main_test.go source_modes.go source_modes_test.go)"
          go test -mod=vendor ./...
          go test -race -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Lint Go sources
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          working-directory: luci-app-ssclash/profile-merge
          args: --modules-download-mode=vendor

      - name: Check OpenWrt shell and LuCI sources
        run: |
          sh -n install-ssclash.sh
          sh -n luci-app-ssclash/rootfs/usr/libexec/ssclash-profile-sync
          sh -n luci-app-ssclash/rootfs/etc/init.d/ssclash-profile-sync
          shellcheck -s sh install-ssclash.sh
          shellcheck -s sh -e SC2034,SC3043 \
            luci-app-ssclash/rootfs/usr/libexec/ssclash-profile-sync \
            luci-app-ssclash/rootfs/etc/init.d/ssclash-profile-sync
          bash -n scripts/build-installer-manifest.sh
          bash -n scripts/write-minimal-sdk-config.sh
          bash -n scripts/check-package-scripts.sh
          bash -n tests/installer/test-installer.sh
          bash -n tests/profile-sync/fake-command
          bash -n tests/profile-sync/test-profile-sync.sh
          shellcheck -s bash \
            scripts/build-installer-manifest.sh \
            scripts/write-minimal-sdk-config.sh \
            scripts/check-package-scripts.sh \
            tests/installer/test-installer.sh \
            tests/profile-sync/fake-command \
            tests/profile-sync/test-profile-sync.sh
          (
            cd installer/channels
            sha256sum --check --strict preview.manifest.sha256
          )
          scripts/check-package-scripts.sh
          tests/installer/test-installer.sh
          tests/profile-sync/test-profile-sync.sh
          node --check \
            luci-app-ssclash/rootfs/www/luci-static/resources/view/ssclash/config.js
          jq empty \
            luci-app-ssclash/rootfs/usr/share/rpcd/acl.d/luci-app-ssclash.json
          git diff --check "$(git merge-base HEAD origin/main)" HEAD

      - name: Scan the source tree for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "/tmp/${archive}" |
            sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner

  package:
    name: OpenWrt ${{ matrix.version }} ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.8"
            target: "x86/64"
            package-format: "ipk"
            package-arch: "x86_64"
            device-symbol: ""
          - version: "25.12.5"
            target: "x86/64"
            package-format: "apk"
            package-arch: "x86_64"
            device-symbol: ""
          - version: "25.12.5"
            target: "mediatek/filogic"
            package-format: "apk"
            package-arch: "aarch64_cortex-a53"
            device-symbol: "TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_wbr3000uax-v1"

    env:
      SDK_URL_PATH: https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6

      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file gawk gettext libncurses-dev rsync \
            unzip xsltproc zstd

      - name: Create temporary directories
        run: |
          echo "SDK_DOWNLOAD=$(mktemp -d)" >> "$GITHUB_ENV"
          echo "SDK_HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Download and verify the official SDK
        run: |
          set -eu
          cd "$SDK_DOWNLOAD"
          curl -fsSLo sha256sums \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
            "$SDK_URL_PATH/sha256sums"
          sdk_file="$(
            awk '$2 ~ /openwrt-sdk-.*Linux-x86_64\.tar\.zst$/ {
              sub(/^\*/, "", $2)
              print $2
            }' sha256sums
          )"
          test -n "$sdk_file"
          test "$(printf '%s\n' "$sdk_file" | wc -l)" -eq 1
          curl -fsSLo "$sdk_file" \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
            "$SDK_URL_PATH/$sdk_file"
          awk -v expected="$sdk_file" '
            {
              name = $2
              sub(/^\*/, "", name)
              if (name == expected) {
                print $1 "  " expected
                found = 1
              }
            }
            END { if (!found) exit 1 }
          ' sha256sums > sdk.sha256
          sha256sum --check --strict sdk.sha256
          tar --zstd -xf "$sdk_file" -C "$SDK_HOME" --strip-components=1

      - name: Install only required OpenWrt feeds
        working-directory: ${{ env.SDK_HOME }}
        run: |
          set -eu
          ./scripts/feeds update base packages luci
          ./scripts/feeds install \
            coreutils-base64 curl golang jsonfilter luci-base
          ln -s "${{ github.workspace }}/luci-app-ssclash" \
            "package/$PACKAGE_NAME"

      - name: Configure and build the package
        working-directory: ${{ env.SDK_HOME }}
        run: |
          set -eu
          make defconfig
          "${{ github.workspace }}/scripts/write-minimal-sdk-config.sh" \
            "$SDK_HOME" \
            "${{ matrix.device-symbol }}"
          make defconfig
          grep -qx '# CONFIG_ALL is not set' .config
          grep -qx '# CONFIG_BUILDBOT is not set' .config
          grep -qx 'CONFIG_AUTOREMOVE=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-ssclash=m' .config
          grep -qx \
            'CONFIG_PACKAGE_luci-app-ssclash_Nftables_Transparent_Proxy=y' \
            .config
          if [ -n '${{ matrix.device-symbol }}' ]; then
            grep -qx \
              "CONFIG_${{ matrix.device-symbol }}=y" \
              .config
          fi
          make "package/$PACKAGE_NAME/compile" -j2 V=s

      - name: Collect and inspect the package
        run: |
          set -euo pipefail
          mkdir -p dist
          matches="$(
            find "$SDK_HOME/bin" -type f \
              \( -name "${PACKAGE_NAME}_*.${{ matrix.package-format }}" \
                 -o -name "${PACKAGE_NAME}-*.${{ matrix.package-format }}" \)
          )"
          test -n "$matches"
          test "$(printf '%s\n' "$matches" | wc -l)" -eq 1
          source_package="$matches"
          source_name="$(basename "$source_package")"
          source_stem="${source_name%.${{ matrix.package-format }}}"
          target_name="$(printf '%s' '${{ matrix.target }}' | tr '/' '-')"
          output="dist/${source_stem}-openwrt-${{ matrix.version }}-${target_name}-${{ matrix.package-arch }}.${{ matrix.package-format }}"
          cp "$source_package" "$output"
          (
            cd dist
            sha256sum "$(basename "$output")"
          ) > "${output}.sha256"

          inspect_root="$(mktemp -d)"
          trap 'rm -rf "$inspect_root"' EXIT
          if [ '${{ matrix.package-format }}' = apk ]; then
            "$SDK_HOME/staging_dir/host/bin/apk" extract \
              --allow-untrusted \
              --destination "$inspect_root" \
              "$source_package"
          else
            ipk_root="$inspect_root/ipk-container"
            mkdir "$ipk_root"
            tar -xzf "$source_package" -C "$ipk_root"
            data_archive="$(
              find "$ipk_root" -maxdepth 1 -type f \
                -name 'data.tar.*' -print -quit
            )"
            test -n "$data_archive"
            tar -x -C "$inspect_root" -f "$data_archive"
          fi

          merger="$inspect_root/usr/bin/ssclash-profile-merge"
          helper="$inspect_root/usr/libexec/ssclash-profile-sync"
          profile_config="$inspect_root/etc/config/ssclash_profile"
          links_file="$inspect_root/etc/ssclash-party/links.txt"
          active_config="$inspect_root/opt/clash/config.yaml"
          template_catalog="$inspect_root/usr/share/ssclash-party/templates/catalog.json"
          russia_template="$inspect_root/usr/share/ssclash-party/templates/russia.yaml"
          party_version="$inspect_root/usr/share/ssclash-party/VERSION"
          test -x "$merger"
          test -x "$helper"
          test "$(stat -c '%a' "$profile_config")" = 600
          test "$(stat -c '%a' "$links_file")" = 600
          test "$(stat -c '%a' "$active_config")" = 600
          test "$(cat "$party_version")" = 4.7.0-party.3
          jq -e \
            '.schema_version == 1 and any(.templates[]; .id == "russia")' \
            "$template_catalog" >/dev/null
          grep -q '^proxy-groups:' "$russia_template"
          grep -q '^rules:' "$russia_template"
          grep -q "option source_mode 'subscription'" "$profile_config"
          grep -q "option rules_mode 'auto'" "$profile_config"
          strings "$merger" > "$inspect_root/merger.strings"
          grep -q 'runtime_restart_required' "$inspect_root/merger.strings"
          grep -q 'source_format' "$inspect_root/merger.strings"
          grep -q 'managed-sources' "$inspect_root/merger.strings"
          grep -q 'restart_required' "$helper"

          file_output="$(file "$merger")"
          printf '%s\n' "$file_output"
          case '${{ matrix.package-arch }}' in
            aarch64_*)
              printf '%s\n' "$file_output" | grep -q 'ARM aarch64'
              ;;
            x86_64)
              printf '%s\n' "$file_output" | grep -q 'x86-64'
              ;;
            *)
              echo "No ELF assertion for ${{ matrix.package-arch }}" >&2
              exit 1
              ;;
          esac

          sh -n "$helper"
          sh -n "$inspect_root/etc/init.d/ssclash-profile-sync"
          node --check \
            "$inspect_root/www/luci-static/resources/view/ssclash/config.js"
          jq empty \
            "$inspect_root/usr/share/rpcd/acl.d/luci-app-ssclash.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssclash-${{ matrix.version }}-${{ matrix.package-arch }}-${{ matrix.package-format }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create preview release
    needs:
      - quality
      - package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: ssclash-*
          path: release
          merge-multiple: true

      - name: Build installer release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          scripts/build-installer-manifest.sh \
            release \
            "$RELEASE_TAG" \
            preview \
            release/ssclash-party-preview-manifest
          install -m 0755 \
            install-ssclash.sh \
            release/ssclash-party-install.sh
          (
            cd release
            sha256sum ssclash-party-install.sh > \
              ssclash-party-install.sh.sha256
          )

      - name: Create release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "## SSClash PARTY preview"
            echo
            echo "This is an independent downstream build, not an official zerolabnet release."
            echo
            echo "It adds three configuration sources: adaptive subscriptions, local proxy links with PARTY templates, and manual YAML."
            echo "Managed candidates use Mihomo validation, transactional activation, health checks, and rollback."
            echo
            echo "Every package is architecture-specific because it includes the profile merger."
            echo "Install only the artifact matching the OpenWrt version and package architecture."
            echo "Verify the package with its adjacent .sha256 file before installation."
            echo
            echo "The recommended installer performs exact device matching and verifies every payload:"
            echo
            echo '```sh'
            echo "wget -qO /tmp/ssclash-party-install.sh https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/ssclash-party-install.sh && sh /tmp/ssclash-party-install.sh install"
            echo '```'
          } > release-notes.md

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          body_path: release-notes.md
          files: release/*
          prerelease: true
