# SSClash PARTY routing template: Russia
# This file intentionally contains no proxy nodes, subscription URLs, HWIDs,
# controller credentials, or router-specific listeners.

sniffer:
  enable: true
  override-destination: false
  parse-pure-ip: true
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443

dns:
  default-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query
  enable: true
  ipv6: false
  nameserver:
    - https://8.8.8.8/dns-query#PROXY
  proxy-server-nameserver:
    - https://77.88.8.8/dns-query
    - https://8.8.8.8/dns-query

proxy-groups:
  - name: "🛡️ VPN"
    type: select
    proxies:
      - "⚡ Auto"
    include-all: true
  - name: "📺 YouTube"
    type: select
    proxies:
      - "🛡️ VPN"
  - name: "💬 Discord"
    type: select
    proxies:
      - "🛡️ VPN"
  - name: "🎮 Games"
    type: select
    proxies:
      - DIRECT
      - "🛡️ VPN"
  - name: "⚡ Auto"
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
  - name: PROXY
    type: select
    proxies:
      - "🛡️ VPN"
  - name: "🔓 Direct"
    type: select
    proxies:
      - DIRECT
  - name: "⛔ Block"
    type: select
    proxies:
      - REJECT
  - name: "⏭ Pass"
    type: select
    proxies:
      - PASS

